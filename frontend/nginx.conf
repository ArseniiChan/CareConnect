# SPA fallback for the React Router. Without try_files, refreshing /login
# or any non-root path returns a 404 because nginx has no file at that
# path — only /index.html exists. The try_files directive falls back to
# the SPA shell, which then renders the right route client-side.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets — Vite filenames include a content hash so
    # cache-busting happens automatically when the bundle changes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else — fall through to index.html so React Router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the entry point or its sibling files; they're tiny and
    # we want browsers to pick up new deploys immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
